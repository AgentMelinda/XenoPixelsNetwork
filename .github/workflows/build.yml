# CI compile check for XenoPixels on pushes and pull requests.

name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava --no-daemon

      - name: Build (includes Jar-in-Jar ModernUI)
        run: ./gradlew build jarJar --no-daemon

      - name: Verify ModernUI is nested
        run: |
          shopt -s nullglob
          all=(build/libs/*-all.jar)
          if [ ${#all[@]} -eq 0 ]; then
            echo "Missing -all.jar JiJ artifact"
            ls -la build/libs || true
            exit 1
          fi
          jar tf "${all[0]}" | grep -E 'META-INF/jarjar/ModernUI' || {
            echo "ModernUI not found inside ${all[0]}"
            jar tf "${all[0]}" | grep jarjar || true
            exit 1
          }
          echo "OK: ModernUI nested in ${all[0]}"
