# CI compile + package check for XenoPixels on pushes and pull requests.

name: Build

on:
  push:
    branches: [ main, master, develop, 1.21.1 ]
  pull_request:
    branches: [ main, master, develop, 1.21.1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # XenoPixels compiles against a DragonMineZ build that is not on any Maven repo, so the
      # jar is tracked in this repository. Upstream it is the AgentMelinda/dragonminez release
      # v2.1.3-1.21.1-kiweapon-fix. Verify it here rather than re-downloading: an older release
      # asset lacks methods this mod calls, and swapping it in silently turns into a wall of
      # "cannot find symbol" errors 30 lines into :compileJava.
      - name: Verify DragonMineZ jar
        run: |
          want=$(grep -E '^dragonminez_sha256=' gradle.properties | cut -d= -f2)
          echo "$want  libs/dragonminez-2.1.3.jar" | sha256sum -c -

      - name: Compile
        run: |
          ./gradlew compileJava --no-daemon -PofflineMcMeta \
            -PdmzJar=libs/dragonminez-2.1.3.jar

      # `build` runs :test. Twelve tests currently require untracked generator sources
      # (tools/effekseer/*, tools/guidance_v2_art, examples/customnpcs, docs/xeno-npc-schema.md)
      # that are not in this git tree, so :test fails on a clean checkout. `jarJar` only
      # stages nested libs; `:jar` writes the client artifact. Package both plus the
      # server jar without that gate.
      - name: Package client and server jars
        run: |
          ./gradlew jar jarJar serverJar --no-daemon -PofflineMcMeta \
            -PdmzJar=libs/dragonminez-2.1.3.jar

      - name: Verify ModernUI is nested in the client jar
        run: |
          # MDG 2.x jarJar writes the bundled jar without a classifier; the plain jar is -slim.
          mapfile -t jars < <(ls build/libs/xenopixelsmod-*.jar 2>/dev/null \
            | grep -v -e '-sources\.jar$' -e '-slim\.jar$' -e 'xenopixelsmod-Server-')
          if [ ${#jars[@]} -eq 0 ]; then
            echo "Missing JiJ jar artifact"
            ls -la build/libs || true
            exit 1
          fi
          jar tf "${jars[0]}" | grep -iE 'META-INF/jarjar/modern-ui' || {
            echo "ModernUI not found inside ${jars[0]}"
            jar tf "${jars[0]}" | grep jarjar || true
            exit 1
          }
          echo "OK: ModernUI nested in ${jars[0]}"

      - name: Verify server jar embeds AAA Particles only
        run: |
          mapfile -t servers < <(ls build/libs/xenopixelsmod-Server-*.jar 2>/dev/null)
          if [ ${#servers[@]} -eq 0 ]; then
            echo "Missing xenopixelsmod-Server jar"
            ls -la build/libs || true
            exit 1
          fi
          jar tf "${servers[0]}" | grep '^META-INF/jarjar/' | tee /tmp/server-jarjar.txt
          grep -q 'META-INF/jarjar/metadata.json' /tmp/server-jarjar.txt
          grep -qi 'aaa_particles' /tmp/server-jarjar.txt
          if grep -qiE 'modern-ui|nashorn' /tmp/server-jarjar.txt; then
            echo "Server jar must not embed ModernUI or Nashorn"
            cat /tmp/server-jarjar.txt
            exit 1
          fi
          echo "OK: ${servers[0]} jarjar is AAA Particles only"
