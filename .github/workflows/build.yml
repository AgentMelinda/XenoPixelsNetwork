# CI compile check for XenoPixels on pushes and pull requests.

name: Build

on:
  push:
    branches: [ main, master, develop, '1.21.1' ]
  pull_request:
    branches: [ main, master, develop, '1.21.1' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify DragonMineZ jar
        run: |
          test -f libs/dragonminez-2.1.3.jar
          sha256sum libs/dragonminez-2.1.3.jar

      - name: Build (includes Jar-in-Jar ModernUI)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            refresh=()
            if [ "$attempt" -gt 1 ]; then
              refresh=(--refresh-dependencies)
            fi
            echo "Gradle build attempt $attempt of 3"
            if ./gradlew build jarJar --no-daemon \
              -PdmzJar=libs/dragonminez-2.1.3.jar "${refresh[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Gradle failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          exit 1

      - name: Verify ModernUI is nested
        run: |
          # MDG 2.x jarJar writes the bundled jar without a classifier; the plain jar is -slim.
          mapfile -t jars < <(ls build/libs/xenopixelsmod-*.jar 2>/dev/null \
            | grep -v -e '-sources\.jar$' -e '-slim\.jar$' -e 'xenopixelsmod-Server-')
          if [ ${#jars[@]} -eq 0 ]; then
            echo "Missing JiJ jar artifact"
            ls -la build/libs || true
            exit 1
          fi
          jar tf "${jars[0]}" | grep -iE 'META-INF/jarjar/modern-ui' || {
            echo "ModernUI not found inside ${jars[0]}"
            jar tf "${jars[0]}" | grep jarjar || true
            exit 1
          }
          echo "OK: ModernUI nested in ${jars[0]}"
