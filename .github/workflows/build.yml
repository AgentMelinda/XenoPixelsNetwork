# CI compile check for XenoPixels on pushes and pull requests.

name: Build

on:
  push:
    branches: [ main, master, develop, 1.21.1 ]
  pull_request:
    branches: [ main, master, develop, 1.21.1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # XenoPixels compiles against a DragonMineZ build that is not on any Maven repo.
      # CI pulls it from the DragonMineZ release; keep this in sync with dragonminez_version.
      DMZ_REPO: AgentMelinda/dragonminez
      DMZ_RELEASE_TAG: v2.1.3-1.21.1-ki-aim
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch DragonMineZ jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p libs
          gh release download "$DMZ_RELEASE_TAG" --repo "$DMZ_REPO" \
            --pattern 'dragonminez-*.jar' --dir libs --clobber
          rm -f libs/*-sources.jar
          ls -la libs

      - name: Compile
        run: ./gradlew compileJava --no-daemon

      - name: Build (includes Jar-in-Jar ModernUI)
        run: ./gradlew build jarJar --no-daemon

      - name: Verify ModernUI is nested
        run: |
          # MDG 2.x jarJar writes the bundled jar without a classifier; the plain jar is -slim.
          mapfile -t jars < <(ls build/libs/xenopixelsmod-*.jar 2>/dev/null \
            | grep -v -e '-sources\.jar$' -e '-slim\.jar$' -e 'xenopixelsmod-Server-')
          if [ ${#jars[@]} -eq 0 ]; then
            echo "Missing JiJ jar artifact"
            ls -la build/libs || true
            exit 1
          fi
          jar tf "${jars[0]}" | grep -iE 'META-INF/jarjar/modern-ui' || {
            echo "ModernUI not found inside ${jars[0]}"
            jar tf "${jars[0]}" | grep jarjar || true
            exit 1
          }
          echo "OK: ModernUI nested in ${jars[0]}"
