# Build XenoPixels and publish artifacts to GitHub Releases on version tags.

name: Build And Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # See the matching step in build.yml for why the tracked jar is verified rather than
      # re-downloaded. Upstream: AgentMelinda/dragonminez release v2.1.3-1.21.1-kiweapon-fix.
      - name: Verify DragonMineZ jar
        run: |
          want=$(grep -E '^dragonminez_sha256=' gradle.properties | cut -d= -f2)
          echo "$want  libs/dragonminez-2.1.3.jar" | sha256sum -c -

      # `build` runs :test. Twelve tests currently require untracked generator sources
      # that are not in this git tree, so tag publishes died on :test after compile
      # already succeeded. `jarJar` only stages nested libs; `:jar` writes the client
      # artifact. Package both plus the server jar without the test gate.
      - name: Package client and server jars
        run: |
          ./gradlew jar jarJar serverJar --no-daemon -PofflineMcMeta \
            -PdmzJar=libs/dragonminez-2.1.3.jar

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v${VERSION}"
          fi
          client="build/libs/xenopixelsmod-${VERSION}.jar"
          server="build/libs/xenopixelsmod-Server-${VERSION}.jar"
          test -s "$client"
          test -s "$server"
          jar tf "$client" > /tmp/client-entries.txt
          jar tf "$server" > /tmp/server-entries.txt
          grep -iE '^META-INF/jarjar/modern-ui.*\.jar$' /tmp/client-entries.txt
          grep '^META-INF/jarjar/' /tmp/server-entries.txt | grep -v '/$' > /tmp/server-nested.txt
          test "$(wc -l < /tmp/server-nested.txt)" -eq 2
          grep -Fx 'META-INF/jarjar/metadata.json' /tmp/server-nested.txt
          grep -iE '^META-INF/jarjar/aaa_particles.*\.jar$' /tmp/server-nested.txt
          sha256sum "$client" "$server"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xenopixelsmod-jars
          # The no-classifier jar is the Jar-in-Jar artifact (bundles ModernUI)
          path: |
            build/libs/xenopixelsmod-*.jar
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          jars=("build/libs/xenopixelsmod-${VERSION}.jar" "build/libs/xenopixelsmod-Server-${VERSION}.jar")
          for jar in "${jars[@]}"; do test -s "$jar"; done
          echo "Publishing: ${jars[*]}"
          # --repo is explicit so this keeps working if the step ever runs in a job that has
          # no checkout; gh otherwise infers the repo from the git remote and dies with
          # "fatal: not a git repository".
          if gh release view "${{ github.ref_name }}" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; uploading artifacts"
            gh release upload "${{ github.ref_name }}" "${jars[@]}" --clobber --repo "$GH_REPO"
          else
            gh release create "${{ github.ref_name }}" "${jars[@]}" \
              --repo "$GH_REPO" \
              --title "XenoPixels ${{ github.ref_name }}" \
              --generate-notes
          fi
