# Build XenoPixels and publish artifacts to GitHub Releases on version tags.

name: Build And Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify DragonMineZ jar
        run: |
          test -f libs/dragonminez-2.1.3.jar
          sha256sum libs/dragonminez-2.1.3.jar

      - name: Build with Gradle
        run: ./gradlew build jarJar --no-daemon -PdmzJar=libs/dragonminez-2.1.3.jar

      - name: Verify release artifacts
        run: |
          mapfile -t jars < <(ls build/libs/xenopixelsmod-*.jar 2>/dev/null \
            | grep -v -e '-sources\.jar$' -e '-slim\.jar$')
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No releasable xenopixelsmod jars found under build/libs"
            ls -la build/libs || true
            exit 1
          fi
          echo "Verified: ${jars[*]}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xenopixelsmod-jars
          # The no-classifier jar is the Jar-in-Jar artifact (bundles ModernUI)
          path: |
            build/libs/xenopixelsmod-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: ${{ needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: xenopixelsmod-jars
          path: release-artifacts

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ship the JiJ-bundled client jar (ModernUI nested, no classifier under MDG 2.x)
          # plus the Server variant. Sources and the -slim jar are not published.
          mapfile -t jars < <(ls release-artifacts/xenopixelsmod-*.jar 2>/dev/null \
            | grep -v -e '-sources\.jar$' -e '-slim\.jar$')
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No verified xenopixelsmod jars found under release-artifacts"
            ls -la release-artifacts || true
            exit 1
          fi
          echo "Publishing: ${jars[*]}"
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; uploading artifacts"
            gh release upload "${{ github.ref_name }}" "${jars[@]}" --clobber
          else
            gh release create "${{ github.ref_name }}" "${jars[@]}" \
              --title "XenoPixels ${{ github.ref_name }}" \
              --generate-notes
          fi
