# Build XenoPixels and publish artifacts to GitHub Releases on version tags.

name: Build And Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # Temporary override for deprecated Node 20 actions
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
      # XenoPixels compiles against a DragonMineZ build that is not on any Maven repo.
      # CI pulls it from the DragonMineZ release; keep this in sync with dragonminez_version.
      DMZ_REPO: AgentMelinda/dragonminez
      DMZ_RELEASE_TAG: v2.1.3-1.21.1-ki-aim

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch DragonMineZ jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p libs
          gh release download "$DMZ_RELEASE_TAG" --repo "$DMZ_REPO" \
            --pattern 'dragonminez-*.jar' --dir libs --clobber
          rm -f libs/*-sources.jar
          ls -la libs

      - name: Build with Gradle
        run: ./gradlew build jarJar --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xenopixelsmod-jars
          path: |
            build/libs/xenopixelsmod-*.jar
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t jars < <(ls build/libs/xenopixelsmod-*.jar 2>/dev/null \
            | grep -v -e '-sources\.jar$' -e '-slim\.jar$')
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No xenopixelsmod jars found under build/libs"
            ls -la build/libs || true
            exit 1
          fi
          echo "Publishing: ${jars[*]}"
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; uploading artifacts"
            gh release upload "${{ github.ref_name }}" "${jars[@]}" --clobber
          else
            gh release create "${{ github.ref_name }}" "${jars[@]}" \
              --title "XenoPixels ${{ github.ref_name }}" \
              --generate-notes
          fi
