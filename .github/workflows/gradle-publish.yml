# Build XenoPixels and publish artifacts to GitHub Releases on version tags.

name: Build And Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # See the matching step in build.yml for why the tracked jar is verified rather than
      # re-downloaded. Upstream: AgentMelinda/dragonminez release v2.1.3-1.21.1-kiweapon-fix.
      - name: Verify DragonMineZ jar
        run: |
          want=$(grep -E '^dragonminez_sha256=' gradle.properties | cut -d= -f2)
          echo "$want  libs/dragonminez-2.1.3.jar" | sha256sum -c -

      - name: Build with Gradle
        run: |
          ./gradlew build jarJar --no-daemon -PofflineMcMeta \
            -PdmzJar=libs/dragonminez-2.1.3.jar

      - name: Verify release artifacts
        run: |
          mapfile -t jars < <(ls build/libs/xenopixelsmod-*.jar 2>/dev/null \
            | grep -v -e '-sources\.jar$' -e '-slim\.jar$')
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No releasable xenopixelsmod jars found under build/libs"
            ls -la build/libs || true
            exit 1
          fi
          echo "Verified: ${jars[*]}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xenopixelsmod-jars
          # The no-classifier jar is the Jar-in-Jar artifact (bundles ModernUI)
          path: |
            build/libs/xenopixelsmod-*.jar
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Ship the JiJ-bundled client jar (ModernUI nested, no classifier under MDG 2.x)
          # plus the Server variant. Sources and the -slim jar are not published.
          mapfile -t jars < <(ls build/libs/xenopixelsmod-*.jar 2>/dev/null \
            | grep -v -e '-sources\.jar$' -e '-slim\.jar$')
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No xenopixelsmod jars found under build/libs"
            ls -la build/libs || true
            exit 1
          fi
          echo "Publishing: ${jars[*]}"
          # --repo is explicit so this keeps working if the step ever runs in a job that has
          # no checkout; gh otherwise infers the repo from the git remote and dies with
          # "fatal: not a git repository".
          if gh release view "${{ github.ref_name }}" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; uploading artifacts"
            gh release upload "${{ github.ref_name }}" "${jars[@]}" --clobber --repo "$GH_REPO"
          else
            gh release create "${{ github.ref_name }}" "${jars[@]}" \
              --repo "$GH_REPO" \
              --title "XenoPixels ${{ github.ref_name }}" \
              --generate-notes
          fi
