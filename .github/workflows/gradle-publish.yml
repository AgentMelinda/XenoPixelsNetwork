# Build XenoPixels and publish artifacts to GitHub Releases on version tags.

name: Build And Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xenopixelsmod-jars
          path: build/libs/xenopixelsmod-*.jar
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          jars=(build/libs/xenopixelsmod-*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No xenopixelsmod jars found under build/libs"
            ls -la build/libs || true
            exit 1
          fi
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; uploading artifacts"
            gh release upload "${{ github.ref_name }}" "${jars[@]}" --clobber
          else
            gh release create "${{ github.ref_name }}" "${jars[@]}" \
              --title "XenoPixels ${{ github.ref_name }}" \
              --generate-notes
          fi
