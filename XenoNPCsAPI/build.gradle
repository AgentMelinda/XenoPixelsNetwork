plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = api_version
group = api_group

base {
    archivesName = 'xenoapi'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// Compile-only against NeoForge; this is a plain library jar, not a mod (no neoforge.mods.toml).
neoForge {
    version = neo_version
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
