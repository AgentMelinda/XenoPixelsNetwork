plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            gameDirectory = file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.xenopixelsmod
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex 'software\\.bernie.*' }
    }
    maven {
        name = 'TerraBlender'
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'com.github.glitchfiend' }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'CC Tweaked'
        url = 'https://maven.squiddev.cc/'
        content { includeGroup 'cc.tweaked' }
    }
    maven {
        name = 'Xaero'
        url = 'https://chocolateminecraft.com/maven/'
        content {
            includeGroup 'xaero.map'
            includeGroup 'xaero.lib'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven/'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Sable Companion'
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup 'dev.ryanhcode.sable-companion' }
    }
}

dependencies {
    // The special DMZ 1.21.1 build produced by the parent repository.
    implementation files('../build/libs/dragonminez-2.1.3.jar')

    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Sable replaces the old Valkyrien Skies 2 integration.
    implementation "maven.modrinth:${sable_project_id}:${sable_version_id}"
    implementation "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_companion_version}"

    // Optional integrations. Only their public/development APIs are compiled against.
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-common-api:${cc_tweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-core-api:${cc_tweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-forge-api:${cc_tweaked_version}"
    compileOnly "xaero.lib:xaerolib-neoforge-1.21.1:${xaerolib_version}"
    compileOnly "xaero.map:xaeroworldmap-neoforge-1.21.1:${xaero_world_map_version}:all"

    // ---- Modern UI (1.20.1 parity: Jar-in-Jar embed) ----
    // Ships ModernUI-NeoForge inside the XenoPixels jar. Soft-dep remains in neoforge.mods.toml.
    // MDG 2.x JarJar uses the version {} DSL (not ForgeGradle jarJar.ranged/pin).
    jarJar("maven.modrinth:modern-ui:${modernui_version}") {
        version {
            strictly modernui_version
            prefer modernui_version
        }
    }
    // Run classpath without unpacking the outer jar (dev runs).
    additionalRuntimeClasspath "maven.modrinth:modern-ui:${modernui_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll '-Xlint:-deprecation', '-Xlint:-removal', '-Xmaxerrs', '10000', '-Xmaxwarns', '10000'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    archiveClassifier = ''
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : mod_version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'xenopixelsmod.mixins.json,xenopixelsmod.compat.mixins.json'
        ])
    }
}

// Jar-in-Jar output embeds ModernUI under META-INF/jarjar/. jarJar depends on :jar already.
// Default client distribution: empty classifier with ModernUI nested (jarJar).
// Server/slim distribution: no ModernUI — use for dedicated servers and CI that
// must not pull client UI deps. Filename matches:
//   xenopixelsmod-Server-0.1.8-1.21.1.jar
tasks.register('serverJar', Jar) {
    group = 'build'
    description = 'Server/slim jar without embedded Modern UI (no META-INF/jarjar).'
    dependsOn tasks.named('classes'), tasks.named('processResources')
    from sourceSets.main.output
    // Force exact name: xenopixelsmod-Server-<version>.jar
    archiveFileName = "${mod_id}-Server-${project.version}.jar"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : mod_version,
                'Implementation-Title'    : "${project.name} (Server)",
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'xenopixelsmod.mixins.json,xenopixelsmod.compat.mixins.json'
        ])
    }
}

tasks.named('build').configure {
    dependsOn tasks.named('jarJar')
    dependsOn tasks.named('serverJar')
}

// Convenience alias: ./gradlew serverJar
tasks.named('assemble').configure {
    dependsOn tasks.named('serverJar')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // Client jar (with ModernUI JiJ when jarJar is the empty-classifier artifact).
            artifact tasks.named('jarJar')
            // Server/slim jar without ModernUI.
            artifact(tasks.named('serverJar')) {
                classifier = 'Server'
            }
        }
    }
    repositories {
        maven { url = layout.buildDirectory.dir('repo') }
    }
}
