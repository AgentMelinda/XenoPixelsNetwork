plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            gameDirectory = file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.xenopixelsmod
    }
}

configurations {
    // Dev-only mod jars that have to be installed into run/mods rather than put on a run's
    // classpath. See the Iris comment in dependencies {} for why that distinction exists.
    devShaderMods
    // Controlify + YetAnotherConfigLib for dev runs. Same reasoning as devShaderMods: Controlify
    // ships no META-INF/services IModFileCandidateLocator, so a classpath entry would be inert.
    devPadMods
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex 'software\\.bernie.*' }
    }
    maven {
        name = 'TerraBlender'
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'com.github.glitchfiend' }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'CC Tweaked'
        url = 'https://maven.squiddev.cc/'
        content { includeGroup 'cc.tweaked' }
    }
    maven {
        name = 'Xaero'
        url = 'https://chocolateminecraft.com/maven/'
        content {
            includeGroup 'xaero.map'
            includeGroup 'xaero.lib'
        }
    }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'net.createmod.catnip'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    maven {
        // Registrate is not on Create's own maven; this is where Create itself resolves it.
        name = 'Registrate'
        url = 'https://maven.ithundxr.dev/snapshots'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven/'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Sable Companion'
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup 'dev.ryanhcode.sable-companion' }
    }
    maven {
        // CurseMaven - resolves curse.maven:<slug>-<projectId>:<fileId> coordinates directly
        // against CurseForge; used for My NPCs and CustomNPCs-Unofficial, neither of which
        // publishes to a normal Maven repo.
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

// The special DMZ 1.21.1 build XenoPixels compiles against. It is not on any Maven repo, so
// resolve it from, in order: an explicit -PdmzJar / $DMZ_JAR path, the sibling DragonMineZ
// checkout's build output (the normal local dev layout), or this project's libs/ folder (how CI
// gets it - the workflows download the jar from the DragonMineZ release).
def dragonMineZJar = {
    def explicit = findProperty('dmzJar') ?: System.getenv('DMZ_JAR')
    def candidates = []
    if (explicit) {
        candidates << file(explicit)
    }
    candidates << file("${projectDir}/../build/libs/dragonminez-${dragonminez_version}.jar")
    candidates.addAll(fileTree(dir: "${projectDir}/libs",
            includes: ["dragonminez-${dragonminez_version}.jar", 'dragonminez-*.jar'],
            excludes: ['*-sources.jar']).files.sort { it.name }.reverse())

    def found = candidates.find { it.isFile() }
    if (found == null) {
        throw new GradleException("DragonMineZ jar not found. Build it in the sibling DragonMineZ checkout, "
                + "drop dragonminez-${dragonminez_version}.jar into ${projectDir}/libs, or pass -PdmzJar=<path>. "
                + "Looked in: " + candidates.collect { it.path }.join(', '))
    }
    logger.lifecycle("Using DragonMineZ jar: ${found}")
    return found
}()

dependencies {
    // The special DMZ 1.21.1 build produced by the parent repository.
    implementation files(dragonMineZJar)

    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Sable replaces the old Valkyrien Skies 2 integration.
    implementation "maven.modrinth:${sable_project_id}:${sable_version_id}"
    implementation "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_companion_version}"

    // Optional integrations. Only their public/development APIs are compiled against.
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-common-api:${cc_tweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-core-api:${cc_tweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-forge-api:${cc_tweaked_version}"
    // Yet Another World Protector - region protection. Ki griefing asks its flags before
    // breaking blocks; the mod is optional at runtime and the compat is gated on it.
    compileOnly "maven.modrinth:yawp:${yawp_version}"
    // Jade - tooltip when looking at an entity. Its built-in health line draws one heart icon per
    // 2 HP, which is unreadable for DMZ mobs whose health runs to millions, so we replace that line
    // for DMZ entities only. A local jar because Gradle runs offline here and Jade is not on a
    // configured maven; the API surface used is small and stable (@WailaPlugin, ITooltip, JadeIds).
    compileOnly files('libs/Jade-1.21.1-NeoForge-15.10.6.jar')
    // Create - elevator ComputerCraft methods. transitive=false because Create's POM pulls a
    // runtime Flywheel and an open-ended Ponder range we do not want deciding our build; the
    // four libraries it actually needs at compile time are pinned below instead.
    compileOnly("com.simibubi.create:create-1.21.1:${create_version}") { transitive = false }
    compileOnly "net.createmod.ponder:ponder-neoforge:${create_ponder_version}"
    compileOnly "net.createmod.catnip:Catnip-NeoForge-1.21.1:${create_catnip_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${create_flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${create_registrate_version}"
    compileOnly "xaero.lib:xaerolib-neoforge-1.21.1:${xaerolib_version}"
    compileOnly "xaero.map:xaeroworldmap-neoforge-1.21.1:${xaero_world_map_version}:all"
    // My NPCs - NPC editor/scripting mod (curse.maven, package espi.mynpcs). Compat covers a
    // MouseHandler IllegalAccessError in its own script GUI (mirrors the CustomNPCs fix below)
    // plus the race/stats/ki-attack scripting bridge.
    compileOnly "curse.maven:my-npcs-1569534:8686540"
    // CustomNPCs-Unofficial (curse.maven, package noppes.npcs) - same API shape as My NPCs.
    // Previously only string-targeted via Mixin (zero compile footprint); now also compiled
    // against directly for the shared race/stats/ki-attack scripting bridge.
    compileOnly "curse.maven:customnpcs-unofficial-1052708:8414335"
    // GeckoLib stays as implementation (DMZ hair / our geo blocks). CNPC-Gecko-Integration
    // (curse.maven cnpc-gecko-addon) is a separate addon that depends on GeckoLib + CustomNPCs;
    // runtimeOnly puts it on the runClient mods list without replacing GeckoLib or jar-in-jar.
    compileOnly "curse.maven:cnpc-gecko-addon-970162:7272203"
    runtimeOnly "curse.maven:cnpc-gecko-addon-970162:7272203"

    // Controlify - gamepad support. Only its public `dev.isxander.controlify.api` surface is
    // compiled against, plus dev.isxander.controlify.rumble for vibration (see the caveat in
    // client/pad/XenoPadRumble.java). Optional at runtime: everything that touches Controlify
    // lives in client/pad and is reached only through Controlify's own ServiceLoader entrypoint,
    // so with Controlify absent none of those classes is ever loaded.
    compileOnly "maven.modrinth:${controlify_project_id}:${controlify_version_id}"
    // transitive=false so Modrinth's POM does not drag YACL onto the compile classpath; the dev
    // runtime copy below pulls it in deliberately and separately.
    devPadMods("maven.modrinth:${controlify_project_id}:${controlify_version_id}") { transitive = false }
    devPadMods("maven.modrinth:${yacl_project_id}:${yacl_version_id}") { transitive = false }

    // Development-only shader runtime for reproducing and validating Iris compatibility.
    // Neither mod is bundled or required by XenoPixels, and the two arrive by different routes.
    //
    // Sodium goes on the client run's own additionalRuntimeClasspath rather than runtimeOnly:
    // testRuntimeOnly extends runtimeOnly, and neoForge.unitTest boots the real FML mod loader over
    // testRuntimeClasspath, so a runtimeOnly shader runtime makes ':test' fail on Sable/Veil's
    // Sodium version check before a single test class runs. See gradle.properties for the version
    // floor Veil imposes. Sodium is then *discovered* from that classpath because it ships a
    // META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator - that service
    // is what registers it as a mod in a dev run.
    //
    // Iris ships no such locator service, so a classpath entry for it is inert: FML never scans it,
    // never loads it, and never says so - which is exactly how it went unnoticed. It is installed
    // into run/mods instead, by installDevShaderMods below.
    add(neoForge.runs.getByName('client').additionalRuntimeClasspathConfiguration.name,
            "maven.modrinth:AANobbMI:${sodium_version_id}")
    // transitive=false because Modrinth's POM would pull Sodium in behind Iris, and Sodium is
    // already on the client classpath above - FML refuses a mod supplied twice.
    devShaderMods("maven.modrinth:YL57xq9U:${iris_version_id}") { transitive = false }

    // ---- Modern UI (1.20.1 parity: Jar-in-Jar embed) ----
    // Ships ModernUI-NeoForge inside the XenoPixels jar. Soft-dep remains in neoforge.mods.toml.
    // MDG 2.x JarJar uses the version {} DSL (not ForgeGradle jarJar.ranged/pin).
    jarJar("maven.modrinth:modern-ui:${modernui_version}") {
        version {
            strictly modernui_version
            prefer modernui_version
        }
    }
    // Run classpath without unpacking the outer jar (dev runs).
    additionalRuntimeClasspath "maven.modrinth:modern-ui:${modernui_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll '-Xlint:-deprecation', '-Xlint:-removal', '-Xmaxerrs', '10000', '-Xmaxwarns', '10000'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    archiveClassifier = ''
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : mod_version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'xenopixelsmod.mixins.json,xenopixelsmod.compat.mixins.json'
        ])
    }
}

// ModDevGradle jarJar stages ModernUI under META-INF/jarjar/; :jar consumes that output.
// Default client distribution: empty-classifier :jar with ModernUI nested.
// Server/slim distribution: no ModernUI — use for dedicated servers and CI that
// must not pull client UI deps. Filename matches:
//   xenopixelsmod-Server-<mod_version>.jar
tasks.register('serverJar', Jar) {
    group = 'build'
    description = 'Server/slim jar without embedded Modern UI (no META-INF/jarjar).'
    dependsOn tasks.named('classes'), tasks.named('processResources')
    from sourceSets.main.output
    // Force exact name: xenopixelsmod-Server-<version>.jar
    archiveFileName = "${mod_id}-Server-${project.version}.jar"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : mod_version,
                'Implementation-Title'    : "${project.name} (Server)",
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'xenopixelsmod.mixins.json,xenopixelsmod.compat.mixins.json'
        ])
    }
}

tasks.named('build').configure {
    dependsOn tasks.named('jarJar')
    dependsOn tasks.named('serverJar')
}

// Convenience alias: ./gradlew serverJar
tasks.named('assemble').configure {
    dependsOn tasks.named('serverJar')
}

// Iris has to be a jar in the run directory's mods folder to be discovered at all (see the
// dependencies block). run/ is git-ignored, so this is the reproducible way to keep the dev client
// carrying the Iris version gradle.properties actually names.
def installDevShaderMods = tasks.register('installDevShaderMods', Copy) {
    group = 'neoforge runs'
    description = 'Installs the development-only Iris build into run/mods for the dev client.'
    from configurations.devShaderMods
    into layout.projectDirectory.dir('run/mods')
    // A stable filename, so bumping iris_version_id replaces this jar instead of leaving the old
    // one beside it for FML to find and reject as a duplicate mod.
    rename { 'iris-dev.jar' }
}

// Iris is a CLIENT mod, but every non-data run shares gameDirectory = run/, so a jar left in
// run/mods is also picked up by the dedicated server - where Iris's client mixins fail to apply
// and RuntimeDistCleaner logs an ERROR for every client class they touch. That noise buries real
// server errors, which is the opposite of what this shader runtime is for. So the folder is
// prepared for whichever run is actually starting: installed for the client, removed for the
// servers. The runs are never launched concurrently, so this stays deterministic.
def installDevPadMods = tasks.register('installDevPadMods', Copy) {
    group = 'neoforge runs'
    description = 'Installs Controlify and YetAnotherConfigLib into run/mods for the dev client.'
    from configurations.devPadMods
    into layout.projectDirectory.dir('run/mods')
    // Stable filenames for the same reason Iris gets one: bumping a version id should replace the
    // jar rather than leave the old one beside it for FML to reject as a duplicate mod.
    // The Modrinth maven serves these as "<projectId>-<versionId>.jar", not by mod name, so the
    // project id is what identifies which jar this is.
    rename { name ->
        name.startsWith(controlify_project_id) ? 'controlify-dev.jar' : 'yacl-dev.jar'
    }
}
def uninstallDevPadMods = tasks.register('uninstallDevPadMods', Delete) {
    group = 'neoforge runs'
    description = 'Removes the client-only Controlify and YACL builds before a dedicated-server run.'
    delete layout.projectDirectory.file('run/mods/controlify-dev.jar'),
            layout.projectDirectory.file('run/mods/yacl-dev.jar')
}
def uninstallDevShaderMods = tasks.register('uninstallDevShaderMods', Delete) {
    group = 'neoforge runs'
    description = 'Removes the client-only Iris build from run/mods before a dedicated-server run.'
    delete layout.projectDirectory.file('run/mods/iris-dev.jar')
}

// RunModel.taskBefore is MDG's own hook for work a run depends on.
neoForge.runs.getByName('client').taskBefore(installDevShaderMods)
neoForge.runs.getByName('client').taskBefore(installDevPadMods)
neoForge.runs.getByName('server').taskBefore(uninstallDevShaderMods)
neoForge.runs.getByName('server').taskBefore(uninstallDevPadMods)
neoForge.runs.getByName('gameTestServer').taskBefore(uninstallDevShaderMods)
neoForge.runs.getByName('gameTestServer').taskBefore(uninstallDevPadMods)

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // Client jar (with ModernUI JiJ when jarJar is the empty-classifier artifact).
            artifact tasks.named('jarJar')
            // Server/slim jar without ModernUI.
            artifact(tasks.named('serverJar')) {
                classifier = 'Server'
            }
        }
    }
    repositories {
        maven { url = layout.buildDirectory.dir('repo') }
    }
}
