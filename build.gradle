plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
        server {}
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    // Optional Ballistix / Voltaic / VS2-targeted mixins (gated by ConditionalMixinPlugin)
    config "${mod_id}.compat.mixins.json"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    mavenLocal()
    flatDir {
        dirs 'libs'
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content {
            includeGroup 'thedarkcolour'
        }
    }
    maven {
        name = 'Valkyrien Skies Internal'
        url = project.vs_maven_url ?: 'https://maven.valkyrienskies.org'
        if (project.vs_maven_username && project.vs_maven_password) {
            credentials {
                username = project.vs_maven_username
                password = project.vs_maven_password
            }
        }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'IzzelAliz Maven'
        url = 'https://maven.izzel.io/releases/'
    }
    // LDLib migration target (Phase 1) — Modrinth-hosted, must stay exclusive to
    // maven.modrinth so it can't shadow/override other repos' coordinates.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

// library = extra run classpath; jarJar = embedded into the output mod jar (JiJ)
configurations {
    library
    implementation.extendsFrom library
}

minecraft.runs.configureEach {
    lazyToken('minecraft_classpath') {
        configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
    }
}

// Enable Forge Jar-in-Jar embedding
jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))

    implementation("org.valkyrienskies.core:api:${vs_core_version}") { transitive = false }
    implementation("org.valkyrienskies.core:internal:${vs_core_version}") { transitive = false }
    implementation("org.valkyrienskies.core:util:${vs_core_version}") { transitive = false }
    implementation("org.valkyrienskies.core:impl:${vs_core_version}") { transitive = false }
    implementation(fg.deobf("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}")) {
        transitive = false
        exclude group: 'org.valkyrienskies.core', module: ''
    }

    // ---- Ballistix + Voltaic (optional at runtime; compileOnly + fg.deobf for mixins) ----
    // flatDir jars: libs/voltaic-1.0.11.jar , libs/ballistix-1.0.9.jar
    // Mixins gated by ConditionalMixinPlugin. Run: ./gradlew runClient -PxenoWithBallistix
    compileOnly fg.deobf("blank:voltaic:1.0.11")
    compileOnly fg.deobf("blank:ballistix:1.0.9")
    if (project.hasProperty('xenoWithBallistix')) {
        library fg.deobf("blank:voltaic:1.0.11")
        library fg.deobf("blank:ballistix:1.0.9")
    }

    implementation fg.deobf("curse.maven:dragonminez-1136088:8469416")
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.8.3')
    implementation 'com.eliotlash.mclib:mclib:20'
    implementation fg.deobf('com.github.glitchfiend:TerraBlender-forge:1.20.1-3.0.1.10')
    implementation fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
    implementation 'thedarkcolour:kotlinforforge:4.11.0'

    // ---- LDLib (Phase 1 of the ModernUI -> LDLib HUD migration, see plan.md) ----
    // Resolved only for now; not yet used to render anything, and not Jar-in-Jar'd
    // (external required dependency per plan.md §4.5 — no bundling until license review).
    implementation fg.deobf("maven.modrinth:${ldlib_modrinth_project}:${ldlib_modrinth_version}")

    // ---- Modern UI (run classpath) ----
    def muiExcludes = {
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.jetbrains', module: 'annotations'
        exclude group: 'com.ibm.icu', module: 'icu4j'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
    }

    library("icyllis.modernui:ModernUI-Core:${modernui_core_version}") {
        muiExcludes.delegate = delegate
        muiExcludes()
    }
    library("icyllis.modernui:ModernUI-Markflow:${modernui_core_version}") {
        muiExcludes.delegate = delegate
        muiExcludes()
    }
    // Deobf forge mod for compile/run
    implementation fg.deobf("icyllis.modernui:ModernUI-Forge:${minecraft_version}-${modernui_version}")

    // ---- Modern UI embedded via Jar-in-Jar (ships inside our mod jar) ----
    // Pin exact versions so FML can resolve a single nested artifact.
    jarJar(group: 'icyllis.modernui', name: 'ModernUI-Forge', version: "[${minecraft_version}-${modernui_version}]") {
        jarJar.pin(it, "${minecraft_version}-${modernui_version}")
        jarJar.ranged(it, "[${minecraft_version}-${modernui_version},${minecraft_version}-${modernui_version}]")
    }
    jarJar(group: 'icyllis.modernui', name: 'ModernUI-Core', version: "[${modernui_core_version}]") {
        jarJar.pin(it, modernui_core_version)
        jarJar.ranged(it, "[${modernui_core_version},${modernui_core_version}]")
        muiExcludes.delegate = delegate
        muiExcludes()
    }
    jarJar(group: 'icyllis.modernui', name: 'ModernUI-Markflow', version: "[${modernui_core_version}]") {
        jarJar.pin(it, modernui_core_version)
        jarJar.ranged(it, "[${modernui_core_version},${modernui_core_version}]")
        muiExcludes.delegate = delegate
        muiExcludes()
    }
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

processResources {
    inputs.properties replaceProperties
    filesMatching(resourceTargets) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json,${mod_id}.compat.mixins.json"
        ])
    }
}

// Jar-in-Jar fat artifact: build/libs/xenopixelsmod-<ver>-all.jar
// (META-INF/jarjar embeds ModernUI-Forge + Core + Markflow)
// FG auto-creates reobfJarJar when jarJar is enabled.
tasks.named('jar').configure {
    finalizedBy 'jarJar'
}
tasks.named('build').configure {
    dependsOn 'jarJar'
    // Prefer reobfuscated JiJ jar when available
    dependsOn tasks.matching { it.name == 'reobfJarJar' }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // Prefer the JiJ-bundled archive when present
            artifact(tasks.named('jarJar'))
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
