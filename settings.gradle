pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'xenopixelsmod'

// XenoAPI source is compiled into the mod from this separate checkout (see build.gradle).
if (!file('XenoNPCsAPI/src/main/java/xenoapi/npcs/api/NpcAPI.java').isFile()) {
    throw new GradleException('Missing XenoNPCsAPI source checkout. Follow docs/native-xenoapi-adapters.md#clean-checkout-setup, then rerun Gradle.')
}
