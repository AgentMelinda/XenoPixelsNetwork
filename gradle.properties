# Shader compatibility test runtime. These are development-only Modrinth version IDs and are
# intentionally not declared as required dependencies or bundled into the production mod jar.
# Sodium must stay at or above 0.8.12-alpha.2+mc1.21.1. The Sable jar bundles Veil 4.1.4 as
# jar-in-jar, and Veil - like Sable itself - declares every older Sodium "incompatible" with no
# side attribute, so an older pin aborts FML mod loading in dev runs and in the unit-test
# launcher alike. Iris has to move with it: 1.8.14-beta.1 is the only 1.21.1 NeoForge Iris built
# against Sodium 0.8 (1.8.8 and 1.8.12 require sodium [0.6,) and ship Sodium-0.6 mixins).
iris_version_id=KduFYu4t
sodium_version_id=uMOpc5uV

# Controlify - gamepad support, compile-only and optional at runtime. Modrinth version IDs
# because Controlify publishes no browsable creator maven (maven.isxander.dev returns 404 for the
# controlify path), and the Modrinth maven is already declared in build.gradle. YACL is
# Controlify's own required dependency, range [3.8,4); it is listed here only so the dev client
# can install both into run/mods - neither is bundled into the production jar.
controlify_project_id=DOUdJVEm
controlify_version_id=RqsNKKLK
yacl_project_id=1eAoo2KR
yacl_version_id=7TVdVtxF

# Create, compile-only. The elevator ComputerCraft methods talk to Create's ElevatorColumn /
# ElevatorContactBlockEntity API directly, so those types have to be on the compile classpath;
# Create itself stays optional at runtime and the registration is gated on the class existing.
# The other four are Create's own compile-time libraries — javac needs them to resolve the
# supertypes of the elevator classes, and none of them is shipped or required at runtime.
create_version=6.0.11-295
create_ponder_version=1.0.87+mc1.21.1
create_flywheel_version=1.0.6-44
create_registrate_version=MC1.21-1.3.0+67
create_catnip_version=0.8.54
xaerolib_version=1.1.0
xaero_world_map_version=1.40.16

# Modern UI (NeoForge 1.21.1) — optional runtime / soft dep (text + font stack).
# https://modrinth.com/mod/modern-ui
modernui_modrinth_project=3sjzyvGR
modernui_version=3.13.0.1

# MMO Econ — server-side-only economy mod backing the sign shops. NEVER a compile dependency and
# never required at runtime: it goes on the dev runtime only, so the integration can be exercised
# in a dev run. CurseMaven coordinate curse.maven:mmo-econ-1553133:8829178.
# Verified 2026-09-12 against the resolved jar: modId "mmoecon", version 1.1.0, package
# com.casp3rnz.mmoecon. API surface and evidence class are recorded in docs/shops-and-plots.md.
mmoecon_project_id=1553133
mmoecon_file_id=8829178

# WorldEdit — plot region selection. compileOnly so the project still builds without it, and
# optional at runtime: every use lives behind compat/worldedit/WorldEditBridge, gated on the class
# being present, so XenoPixels loads and runs with WorldEdit absent.
# Modrinth project 1u6JkXh5, version WTAFvuRx = 7.3.8 (MC 1.21-1.21.1, fabric+neoforge,
# environment server_only). Verified 2026-09-12; see docs/shops-and-plots.md.
worldedit_project_id=1u6JkXh5
worldedit_version_id=WTAFvuRx
