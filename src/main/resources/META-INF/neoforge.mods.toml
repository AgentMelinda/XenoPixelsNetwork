modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# NeoForge 1.21 loads mixins from here for source-set runs (runClient). The JAR
# MANIFEST MixinConfigs attribute is not applied to the exploded Gradle classpath.
[[mixins]]
config="xenopixelsmod.mixins.json"

[[mixins]]
config="xenopixelsmod.compat.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="dragonminez"
type="required"
versionRange="[2.1.3,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="required"
versionRange="[2.0.3,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sablecompanion"
type="required"
versionRange="[1.6.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[6.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="computercraft"
type="optional"
versionRange="[1.120,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="xaeroworldmap"
type="optional"
versionRange="[1.40,)"
ordering="AFTER"
side="CLIENT"

# CustomNPCs-Unofficial — its Model Creation GUI (and a few other components) crashes with
# IllegalAccessError calling its own MouseHandler accessor in some multiplayer sessions (see
# mixin/compat/customnpcs and mixin/compat/shared). Also carries the server-side race/stats/
# ki-attack scripting bridge (see compat/npc), hence side="BOTH" rather than client-only.
# A wide lower bound: an "optional" dependency that IS installed must still satisfy this range,
# so a narrow bound would turn a soft compat hook into a hard boot failure on a differently-
# versioned build.
[[dependencies.${mod_id}]]
modId="customnpcs"
type="optional"
versionRange="[1.21.1,)"
ordering="AFTER"
side="BOTH"

# CNPC-Gecko-Addon — gecko models on CustomNPCs. Optional; commands/scripts no-op if absent.
[[dependencies.${mod_id}]]
modId="cnpcgeckoaddon"
type="optional"
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"

# My NPCs — same MouseHandler IllegalAccessError as CustomNPCs above, in its own script GUI
# (see mixin/compat/mynpcs and mixin/compat/shared), plus the same race/stats/ki-attack
# scripting bridge (see compat/npc). Same wide-lower-bound rationale as CustomNPCs above.
[[dependencies.${mod_id}]]
modId="mynpcs"
type="optional"
versionRange="[1.21.1,)"
ordering="AFTER"
side="BOTH"

# Yet Another World Protector — region protection. When present, its flags can veto
# DragonMineZ ki griefing (see XenoServerConfig#yawpKiGriefingEnabled).
#
# The range must stay below the oldest beta we tolerate: an "optional" dependency that IS
# installed must still satisfy versionRange, so a narrow bound turns a soft compat hook into
# a hard boot failure. Maven also orders "0.6.2-beta1" BELOW "0.6.2", so a "[0.6.2,)" bound
# would still reject the 0.6.2 betas. "[0.6,)" accepts the whole 0.6 line including betas.
[[dependencies.${mod_id}]]
modId="yawp"
type="optional"
versionRange="[0.6,)"
ordering="AFTER"
side="BOTH"

# Create — the elevator ComputerCraft methods (see compat/create/elevator). Create is compiled
# against but never required: with it absent the peripheral is simply not registered, and the
# Create wrench support elsewhere works off registry names and needs no dependency at all.
#
# Same wide-range rule as YAWP above: an installed "optional" must still satisfy the range, so
# "[6.0,)" covers the whole Create 6 line rather than turning a version bump into a boot
# failure. The elevator API this uses has been stable across 6.0.x on both 1.20.1 and 1.21.1.
[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[6.0,)"
ordering="AFTER"
side="BOTH"

# Modern UI — Jar-in-Jar bundled (see build.gradle jarJar). Soft-dep so an external
# ModernUI-NeoForge 1.21.1 install still coexists cleanly with the nested copy.
[[dependencies.${mod_id}]]
modId="modernui"
type="optional"
versionRange="[3.12.0,)"
ordering="AFTER"
side="BOTH"
