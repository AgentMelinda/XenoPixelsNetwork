modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="dragonminez"
type="required"
versionRange="[2.1.3,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="required"
versionRange="[2.0.3,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sablecompanion"
type="required"
versionRange="[1.6.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[6.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="computercraft"
type="optional"
versionRange="[1.120,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="xaeroworldmap"
type="optional"
versionRange="[1.40,)"
ordering="AFTER"
side="CLIENT"

# Yet Another World Protector — region protection. When present, its flags can veto
# DragonMineZ ki griefing (see XenoServerConfig#yawpKiGriefingEnabled).
#
# The range must stay below the oldest beta we tolerate: an "optional" dependency that IS
# installed must still satisfy versionRange, so a narrow bound turns a soft compat hook into
# a hard boot failure. Maven also orders "0.6.2-beta1" BELOW "0.6.2", so a "[0.6.2,)" bound
# would still reject the 0.6.2 betas. "[0.6,)" accepts the whole 0.6 line including betas.
[[dependencies.${mod_id}]]
modId="yawp"
type="optional"
versionRange="[0.6,)"
ordering="AFTER"
side="BOTH"

# Modern UI — Jar-in-Jar bundled (see build.gradle jarJar). Soft-dep so an external
# ModernUI-NeoForge 1.21.1 install still coexists cleanly with the nested copy.
[[dependencies.${mod_id}]]
modId="modernui"
type="optional"
versionRange="[3.12.0,)"
ordering="AFTER"
side="BOTH"
